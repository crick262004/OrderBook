name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      # Keep all matrix legs running when one fails: the failure pattern
      # (one OS vs all four jobs) is itself diagnostic.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        preset: [debug, release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 defaults to GCC 13, whose libstdc++ lacks <print> (C++23).
      - name: Select GCC 14 on Linux
        if: runner.os == 'Linux'
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('OrderbookTest/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
